name: DigitalOS Quality Gate

# Le juge automatique. Tourne à chaque push/PR.
# Si un BLOCK subsiste (secret exposé, SEO/GEO non conforme, Lighthouse sous seuil),
# le job échoue → le deploy Vercel branché sur ce workflow ne part pas.
# C'est ici que « jamais 100% vérifié » devient « impossible de livrer non conforme ».

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 1. Build du site (adapter si le script diffère : next build && next export, vite build, etc.)
      - name: Install & build
        run: |
          npm ci
          npm run build

      # 2. Dépendances du gate (isolées, n'alourdissent pas le site)
      - name: Install gate deps
        run: npm --prefix quality-gate ci || npm --prefix quality-gate install

      # 3. Checks déterministes : sécurité + SEO/GEO/AEO (0 token)
      - name: Deterministic checks
        run: node quality-gate/run.mjs --config quality-gate/quality-gate.config.json --root .

      # 4. Lighthouse CI : perf / seo / a11y / best-practices avec budgets bloquants
      - name: Lighthouse CI
        run: npx --prefix quality-gate lhci autorun --config=quality-gate/lighthouserc.json
