name: DigitalOS Quality Gate

# Le juge automatique. Tourne à chaque push/PR.
# Si un BLOCK subsiste (secret exposé, SEO/GEO non conforme, Lighthouse sous seuil),
# le job échoue → le deploy Vercel branché sur ce workflow ne part pas.

on:
  push:
    branches: [main, da-validee]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test

      # Dépendances du gate, isolées du site.
      - name: Install gate deps
        run: npm --prefix quality-gate ci

      # Checks déterministes : sécurité + SEO/GEO/AEO (0 token).
      - name: Deterministic checks
        run: node quality-gate/run.mjs --config quality-gate/quality-gate.config.json --root .

      # Lighthouse CI : perf / seo / a11y / best-practices avec budgets bloquants.
      - name: Lighthouse CI
        run: npx --prefix quality-gate lhci autorun --config=quality-gate/lighthouserc.json

      # Rapports conservés dans GitHub, jamais sur un stockage public tiers.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
